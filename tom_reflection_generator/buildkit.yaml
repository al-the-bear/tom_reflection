# yaml-language-server: $schema=../../../.tom/json-schema/buildkit/buildkit.schema.json
# Tom Build Configuration for tom_reflection_generator (reflectiongenerator)

# Regenerate lib/src/version.versioner.dart on every build. The `:v` stage
# runs before `:comp` (see buildkit_master.yaml), so the compiled binary always
# embeds the current version, build number, git commit and build timestamp.
# variable-prefix: reflectionGen -> generated class ReflectionGenVersionInfo.

project_id: RFLG
name: reflectgen
description: >-
  Reflection code generator.
license: BSD-3-Clause

versioner:
  variable-prefix: reflectionGen

compiler:
  compiles:
    # macOS ARM64 - compile for self; with --all-platforms also linux-x64 (bigbeast builds it natively)
    - pipeline:
      - shell mkdir -p $TOM_BINARY_PATH/%{target-platform-vs}
      - shell dart compile exe %{file} --target-os=%{dart-target-os} --target-arch=%{dart-target-arch} -o $TOM_BINARY_PATH/%{target-platform-vs}/reflectiongenerator
      files: bin/tom_reflection_generator.dart
      targets: [darwin-arm64, linux-x64]
      platforms: [darwin-arm64]
    
    # Unix-like platforms - compile for self only
    - pipeline:
      - shell mkdir -p $TOM_BINARY_PATH/%{target-platform-vs}
      - shell dart compile exe %{file} --target-os=%{dart-target-os} --target-arch=%{dart-target-arch} -o $TOM_BINARY_PATH/%{target-platform-vs}/reflectiongenerator
      files: bin/tom_reflection_generator.dart
      platforms: [darwin-x64, linux-*]

    # Windows - compile for self only
    - pipeline:
      - shell dart compile exe %{file} --target-os=%{dart-target-os} --target-arch=%{dart-target-arch} -o $TOM_BINARY_PATH/win32-x64/reflectiongenerator.exe
      files: bin/tom_reflection_generator.dart
      platforms: [win32-*]

  postcompile:
    # Make binaries executable on Unix-like systems
    - pipeline:
      - shell chmod -R +x $TOM_BINARY_PATH/%{current-platform-vs}/
      platforms: [macos, linux]
